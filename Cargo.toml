[package]
name = "fidra-music"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1"
ureq = { version = "3.5.2", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_SystemInformation"
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams"
] }

[build-dependencies]
slint-build = "1"
