[package]
name = "fidra-island"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "A lightweight Windows Dynamic Island media controller with real-time synced lyrics, built with Rust and Slint."
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kakasi = "0.1.0"
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1"
ureq = { version = "3.5.2", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation"
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams"
] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
